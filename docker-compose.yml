version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cloudpulse-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cloudpulse
      POSTGRES_USER: cloudpulse
      POSTGRES_PASSWORD: cloudpulse_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudpulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudpulse-backend
    restart: unless-stopped
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://cloudpulse:cloudpulse_secure_password_2026@db:5432/cloudpulse
      - PORT=5000
      - HOST=0.0.0.0
      - SECRET_KEY=production-cloudpulse-secret-key-prod
      - REMEDIATION_ENABLED=true
      - REMEDIATION_REQUIRE_APPROVAL=false
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudpulse-agent
    restart: unless-stopped
    command: ["python", "agent/main.py", "--daemon", "--server-id", "srv-docker-node", "--backend-url", "http://backend:5000/api", "--interval", "10"]
    depends_on:
      - backend

volumes:
  pgdata:
